# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec

# Omarchy bindings
bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, firefox
bindd = SUPER SHIFT ALT, B, Browser (private), exec, firefox --private-window
bindd = SUPER SHIFT, E, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT ALT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT ALT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"
bindd = SUPER SHIFT, S, spotify, exec, omarchy-launch-or-focus spotify

### -----------------------------------------------------------------------------------------

# Personal keybinds
bindd = SUPER ALT, B, Power profiles, exec, omarchy-menu power

## Music controller
bindd = SUPER, period, Play/Pause, exec, omarchy-swayosd-client --playerctl play-pause
unbind = SUPER ALT, right
unbind = SUPER ALT, left
bindd = SUPER ALT, right, Next track, exec, omarchy-swayosd-client --playerctl next
bindd = SUPER ALT, left, Previous track, exec, omarchy-swayosd-client --playerctl previous

### -----------------------------------------------------------------------------------------

## If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, C, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, T, TradingView, exec, omarchy-launch-webapp "https://www.tradingview.com/chart/IRfNHvdF/?symbol=FOREXCOM%3ANAS100"
bindd = SUPER SHIFT ALT, C, Claude AI, exec, omarchy-launch-webapp "https://claude.ai/projects"
bindd = SUPER SHIFT, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
bindd = SUPER SHIFT, G, GitHub, exec, omarchy-launch-webapp "https://github.com/"
bindd = SUPER SHIFT, N, Notion, exec, omarchy-launch-webapp "https://www.notion.so/WorkStation-208f09cb5ebe800c8a44ec038098c8a0"
bindd = SUPER SHIFT, W, Whatsapp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, Y, Youtube, exec, omarchy-launch-webapp "https://www.youtube.com"
