# 01-t470.conf - TLP config para ThinkPad T470 (i5-6200U, 32GB RAM, SSD SATA)
# Objetivo: máx. performance ligado à corrente; balanced (proteção bateria) em bateria
# Perfis geridos via tlp-pd: performance / balanced / power-saver
# Ver: https://linrunner.de/tlp/settings

# ===================================================================
# CPU
# ===================================================================

# AC = sempre performance máxima
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100

# BAT (perfil "balanced" default) = equilíbrio, não powersave extremo
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80

# ===================================================================
# Platform profile — usado pelo tlp-pd para mapear os 3 perfis do walker
# ===================================================================
# AC -> performance | BAT -> balanced (o "power-saver" é ativado manualmente
# via walker/tlp-pd e sobrepõe-se a isto independentemente do AC/BAT)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced

# ===================================================================
# Disco (SSD SATA)
# ===================================================================
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=medium_power

# ===================================================================
# Wi-Fi (Intel, comum no T470)
# ===================================================================
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ===================================================================
# USB autosuspend
# ===================================================================
USB_AUTOSUSPEND=1
# Se algum periférico (rato/teclado) tiver soluços, exclui-o pelo ID:
# USB_DENYLIST="0123:4567"

# ===================================================================
# PCIe ASPM
# ===================================================================
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=default

# ===================================================================
# Radio devices ao arrancar
# ===================================================================
DEVICES_TO_DISABLE_ON_STARTUP=""
DEVICES_TO_DISABLE_ON_BAT=""

# ===================================================================
# Bateria — ThinkPad charge thresholds
# ===================================================================
# Confirma o nome correto com: upower -e | grep BAT
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=90
RESTORE_THRESHOLDS_ON_BAT=1
