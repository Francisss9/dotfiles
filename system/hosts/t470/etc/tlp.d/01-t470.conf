# 01-t470.conf - TLP config para ThinkPad T470 (i5-6200U, 32GB RAM, SSD SATA)
# Objetivo: 3 níveis DISTINTOS, cada um no seu extremo relativo
#   AC        -> performance máxima (à corrente, sem compromissos)
#   BAT       -> balanced real (equilíbrio, perfil default em bateria)
#   SAV       -> poupança extrema (ativado manualmente via walker/tlp-pd,
#                sobrepõe-se ao BAT independentemente da fonte de energia)
# Ver: https://linrunner.de/tlp/settings

# ===================================================================
# CPU
# ===================================================================

# AC = sempre performance máxima
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100

# BAT = balanced real: mantém boost disponível, teto mais alto que o SAV
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80

# SAV (Power Saver manual) = extremo, sem boost, teto baixo
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_SAV=0
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=50

# ===================================================================
# Platform profile — usado pelo tlp-pd para mapear os 3 perfis do walker
# ===================================================================
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# ===================================================================
# Disco (SSD SATA)
# ===================================================================
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto

# SATA link power: BAT fica em medium (bom equilíbrio latência/poupança),
# SAV vai ao mínimo absoluto
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=medium_power
SATA_LINKPWR_ON_SAV=min_power

# ===================================================================
# Runtime PM genérico (PCI: GPU, controladores, etc — não só disco)
# ===================================================================
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ===================================================================
# Wi-Fi (Intel, comum no T470)
# ===================================================================
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ===================================================================
# Áudio
# ===================================================================
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ===================================================================
# USB autosuspend
# ===================================================================
USB_AUTOSUSPEND=1
# Se algum periférico (rato/teclado) tiver soluços, exclui-o pelo ID:
# USB_DENYLIST="0123:4567"

# ===================================================================
# PCIe ASPM
# ===================================================================
# BAT fica em "powersave" (agressivo mas estável); SAV vai ao extremo
# "powersupersave" — testa estabilidade de Wi-Fi/WWAN antes de confiar,
# se houver desconexões recua o SAV para "powersave" também.
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersupersave

# ===================================================================
# Radio devices ao arrancar
# ===================================================================
DEVICES_TO_DISABLE_ON_STARTUP=""
DEVICES_TO_DISABLE_ON_BAT=""

# ===================================================================
# Bateria — ThinkPad charge thresholds
# ===================================================================
# Confirma o nome correto com: upower -e | grep BAT
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=90
START_CHARGE_THRESH_BAT1=80
STOP_CHARGE_THRESH_BAT1=90
RESTORE_THRESHOLDS_ON_BAT=1
